server:
  port: 8888

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      # ETAPE 6 - Configuration DYNAMIQUE : une route /<service-id>/** est créée
      # automatiquement pour chaque service enregistré dans Eureka.
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      # CORS pour le client Angular (http://localhost:4200)
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods: "*"
            allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"
